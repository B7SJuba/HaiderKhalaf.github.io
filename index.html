			<script>
				// Loader Script

				})

			<script>
				// Language Switcher Logic (List) and url querying 

				document.addEventListener("DOMContentLoaded", function () {
				const langSwitcher = document.getElementById("langSwitcherList");
				
				// Check URL parameter first, then local storage, then default to 'en'
				 const urlParams = new URLSearchParams(window.location.search);
				let savedLang = localStorage.getItem("lang");
				let lang = urlParams.get("lang") || savedLang || "en";

				// Set dropdown to saved language
				langSwitcher.value = lang;

				// Update page language and load translations
				setLanguage(lang);
				loadLanguage(lang);
				runTypingEffect(lang); // Running the typing animation

				// Listen for user selection
				langSwitcher.addEventListener("change", function () {
					let selectedLang = this.value;
					localStorage.setItem("lang", selectedLang); // save
					setLanguage(selectedLang);
					loadLanguage(selectedLang);
					runTypingEffect(selectedLang); // Running typing animation on language change
				});

				function setLanguage(lang) {
					document.documentElement.setAttribute("lang", lang);
					document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
				}

				// Load translation file and replace text
				function loadLanguage(langCode) {
					fetch(`lang/${langCode}/index_${langCode}.json`)
					.then(res => res.json())
					.then(data => {
						document.querySelectorAll("[data-i18n]").forEach(el => {
						const key = el.getAttribute("data-i18n");
						if (data[key]) {
							// Handle innerHTML for values with tags (like links <a>)
							if (/<[a-z][\s\S]*>/i.test(data[key])) {
							el.innerHTML = data[key];
							} else {
							el.textContent = data[key];
							}
						}
						});
					})
					.catch(err => console.error("Error loading translation:", err));
				}
				// Typing effect for the header part
				  function runTypingEffect(lang) {
				let txt = "Haider Arrak Khalaf";
				if (lang === "ar") txt = "حيدر عراك خلف";

				const headerEl = document.getElementById("myHeader");
				headerEl.innerHTML = ""; // Clear previous text

				let i = 0;
				let speed = 150;

					function typingEffect() {
						if (i < txt.length) {
							headerEl.innerHTML += txt.charAt(i);
							i++;
							setTimeout(typingEffect, speed);
							}
						}
					typingEffect();
    				}

				});
			</script>



			<script>
				//This script tries to play the bg video, if it's blocked then the gif will display instead.
				document.addEventListener('DOMContentLoaded', () => {
				const video = document.getElementById('video-background');
				const fallback = document.getElementById('video-fallback');

				// Function to show fallback if video can't play
				function showFallback() {
					if (video) video.style.display = 'none';
					if (fallback) fallback.style.display = 'block';
				}

				// Try to play video programmatically (some browsers block autoplay)
				if (video) {
					const playPromise = video.play();

					if (playPromise !== undefined) {
					playPromise
						.then(() => {
						// It played — good
						console.log('Background video is playing.');
						})
						.catch((error) => {
						console.warn('Autoplay blocked, using fallback:', error);
						showFallback();
						});
					} else {
					// No autoplay support
					showFallback();
					}
				} else {
					showFallback();
				}
				});
			</script>

			<script>
				// Script to pause post videos when not visible to the viewer
				document.addEventListener("DOMContentLoaded", () => {
				const videos = document.querySelectorAll(".article-thumb");

				// Observer options: video must be at least 50% visible to play
				const observerOptions = {
					root: null,           // viewport
					threshold: 0.5        // 50% visibility required
				};

				const observer = new IntersectionObserver((entries) => {
					entries.forEach(entry => {
					const video = entry.target;

					if (entry.isIntersecting) {
						// Try to play when visible
						const playAttempt = video.play();
						if (playAttempt !== undefined) {
						playAttempt.catch(() => {
							// Autoplay blocked → do nothing
						});
						}
					} else {
						// Pause when off screen
						video.pause();
					}
					});
				}, observerOptions);

				videos.forEach(video => observer.observe(video));
				});
			</script>
